()=>{const f=()=>R(2,5),[a,b,c]=[f(),f(),f()],n=R(5,15),a2=f(),h=R(3,5),k=R(3,6),dd=R(3,7),a3=R(2,6),cc=R(2,6),sgn=pick([1,-1]),k2=R(2,5),h2=R(3,5),g=R(5,15);

const HT=[['Bajo el suelo significa por debajo del 0: usa un número negativo.','Retroceder es ir hacia la izquierda en la recta. Cuenta las unidades desde el punto de partida; puedes cruzar el 0.','Entre dos negativos, el mayor es el que está más cerca del 0 (más a la derecha).','Colócalos en la recta: el más pequeño es el que está más a la izquierda. Entre negativos, es el de mayor número sin signo.','Si están a lados distintos del 0, la distancia es la suma de sus distancias al 0.','Cuenta los enteros que hay a cada lado del 0, sin contar los extremos, y no olvides el 0.','Aquí los extremos SÍ cuentan: cuenta los negativos, el 0 y los positivos.','Son los enteros que hay entre −k y 0, sin incluir ninguno de los dos extremos.','El punto medio está a la misma distancia de los dos extremos: halla la distancia total, divídela entre 2 y avanza desde el extremo izquierdo.','Menor significa más a la izquierda. Prueba con 0, −3, −6, −9… y ojo: si coincide con el número, no vale.'],['El opuesto cambia el signo: está a la misma distancia del 0, pero al otro lado.','El valor absoluto es la distancia al 0, por eso nunca es negativo.','Calcula primero cada valor absoluto y luego suma.','Su valor absoluto es su distancia al 0. El opuesto de un número negativo es positivo.','Calcula primero cada valor absoluto y luego suma y resta de izquierda a derecha.','Si |x| = k y x es negativo, entonces x = −k. Después haz la suma.','Dos opuestos están a la misma distancia del 0: cada uno está a la mitad de la distancia total.','Haz la lista de enteros con valor absoluto menor que n (de −(n−1) a n−1) y cuéntalos sin olvidar el 0.','Escribe los enteros de −n a n y fíjate cómo se emparejan cada número y su opuesto.','|x| = a significa que x puede ser a o −a. Para que x − y sea lo más grande posible, elige x lo mayor y y lo menor.'],['Sumar un negativo es retroceder en la recta; restar un positivo también.','Subir es sumar. Empieza en la planta negativa y avanza hacia arriba; puedes cruzar el 0.','Restar un negativo equivale a sumar su opuesto: a − (−b) = a + b.','Si una temperatura es positiva y otra negativa, la diferencia es la suma de sus distancias al 0.','Ve de izquierda a derecha, paso a paso, y escribe los resultados intermedios.','Quita los paréntesis: +(−b) es −b y −(−d) es +d. Después calcula.','Hazlo paso a paso: resta lo que gasta y suma lo que recupera. Si baja de 0, sale negativo.','Para despejar x, suma a los dos lados el número que le está restando.','Si x + y = S y conoces x, entonces y = S − x. Ojo al restar con negativos.','Agrupa por parejas: (1 − 2) + (3 − 4) + … ¿Cuánto vale cada pareja y cuántas hay?'],['Positivo por negativo da negativo: multiplica los números y pon el signo.','Menos por menos da más.','Divide los números y aplica la regla de los signos, igual que al multiplicar.','Negativo entre negativo da positivo.','Cada hora baja a grados, así que en h horas baja a · h. Réstalo a la temperatura inicial.','Cada deuda es negativa: multiplica los amigos por lo que debe cada uno y pon signo negativo.','Multiplica de dos en dos y fíjate en el signo: ¿cuántos factores son negativos?','Divide el resultado entre el número que acompaña a x, con la regla de los signos.','Los factores negativos, de dos en dos, dan 1. Mira si el número de factores es par o impar.','Busca parejas de números cuyo producto sea el valor sin signo y mira cuál cumple la suma. Uno es negativo y el otro positivo.'],['Resuelve primero el paréntesis y después resta, cuidado con el signo de delante.','El signo menos delante de un paréntesis cambia el signo de todo lo de dentro; o calcula antes el paréntesis.','Calcula primero el paréntesis y luego multiplica con la regla de los signos.','Primero la multiplicación y después la suma.','Calcula antes el paréntesis y después resta de izquierda a derecha.','Paréntesis primero, luego la multiplicación y al final la resta.','Empieza por el paréntesis más interno y ve hacia fuera.','Primero la división y la multiplicación, de izquierda a derecha; después la suma.','Resuelve las dos multiplicaciones (regla de los signos) y luego resta.','Traduce por partes: «el producto de…» es una multiplicación, «la suma de…» va entre paréntesis y «réstale» va al final.']];

function report(){let t=`HAWKINS: CIERRA LA GRIETA. Informe\nAlumnos: ${S.names||'sin nombre'}\nCurso: ${S.curso||'-'}\nTiempo: ${S.t0?mins()+' min':'-'}${S.done?' (misión completada)':' (en curso)'}\n`;
 for(let s=0;s<6;s++){const L=S.log.filter(x=>x.st===s);if(!L.length)continue;const[n,f]=stats(s);t+=`\n== ${ST[s]}: ${n} intentos, ${f} fallos, ${S.vers[s]-1} cambios de datos ==\n`;
 L.forEach(x=>{t+=`Intento (datos ${x.v}): clave ${x.k} -> ${x.ok?'ACEPTADA':'RECHAZADA'}\n`+x.answers.map(a=>`  ${a.ok?'[OK]':'[X] '} ${a.q} | respuesta: ${a.g||'(vacío)'}`).join('\n')+'\n'})}return t}
function logHTML(){let h='';for(let s=0;s<6;s++){const L=S.log.filter(x=>x.st===s);if(!L.length)continue;const[n,f]=stats(s);
 h+=`<details><summary>${ST[s]} (${n} intento${n>1?'s':''}, ${f} fallo${f==1?'':'s'})</summary>`+L.map(x=>`<p><b class="${x.ok?'ok':'bad'}">${x.ok?'Clave aceptada':'Clave rechazada'}</b> (datos nº ${x.v}). Clave escrita: ${esc(x.k)}</p>${x.answers.length?`<ul>${x.answers.map(a=>`<li class="${a.ok?'ok':a.g?'bad':'mu'}">${a.ok?'Correcta':a.g?'Incorrecta':'Sin responder'}: ${esc(a.q)} (${esc(a.g)||'vacío'})</li>`).join('')}</ul>`:''}`).join('')+'</details>'}
 return h||'<p class="mu">Todavía no hay intentos registrados.</p>'}
function render(){const a=$('#app');let h=lights()+`<header><h1>HAWKINS · CIERRA LA GRIETA</h1><span class="mu">${esc(S.names)}</span></header>`;
 if(!S.started)h+=`<div class="card">${scene()}<h2 style="margin-top:10px">Hawkins, 1985</h2><p>Sois los chicos de Hawkins: Mike, Once, Dustin, Lucas, Max y Will. Una grieta se ha abierto en el laboratorio y el Mundo del Revés se cuela en la ciudad. Solo vosotros podéis cerrarla. La energía de la criatura está encerrada en <b>cinco candados</b> y cada uno se rompe con matemáticas de números enteros: la recta, el valor absoluto y el opuesto, sumas y restas, multiplicaciones y divisiones, y las operaciones con paréntesis.</p><p>En cada prueba hay <b>8 cuestiones</b>. Con ellas se calcula una clave. Si una clave falla, alguna respuesta está mal. Todo queda guardado en vuestro informe: al terminar podréis descargarlo para enviarlo a vuestro profesor.</p><label>Nombres de los integrantes del equipo<input id="names" placeholder="Por ejemplo: Ana, Luis y Marta" autocomplete="off"></label><label style="display:block;margin-top:8px">Curso y grupo<input id="curso" placeholder="1º ESO B" autocomplete="off"></label><div class="row"><button class="p" id="start">Entrar al laboratorio</button></div></div>`;
 else if(S.done){const T=S.log.length,F=S.log.filter(x=>!x.ok).length;h+=`<div class="card win">${lights("SALVADOS")}<h2>La grieta se ha cerrado</h2><p>Hawkins está a salvo. Habéis tardado ${mins()} minutos, con ${T} intentos y ${F} fallos. Descargad el informe y enviádselo a vuestro profesor.</p></div>`}
 else{const c=S.cur,n=stats(S.stage),ks=[0,1,2,3,4].map(i=>S.keys[i]!==undefined?`<b class="g">K${i+1} = ${sg(S.keys[i])}</b>`:`<b>K${i+1}</b>`).join(''),an=S.ans.filter(x=>(x||'').trim()).length;
 h+=`<ol class="st">${ST.map((_,i)=>`<li class="${i<S.stage?'d':i==S.stage?'c':''}"></li>`).join('')}</ol>
 <section class="card" id="prueba"><h2>${IC[S.stage]} ${S.stage<5?'Prueba '+(S.stage+1)+' de 5':'Prueba final'}: ${ST[S.stage]}</h2><p class="mu">${c.intro}</p>${c.data?`<p style="white-space:pre-wrap;border-left:3px solid var(--ac);padding-left:10px">${c.data}</p>`:''}
 ${c.qs.length?`<p class="mu" id="cnt">Respondidas: ${an} de ${c.qs.length}</p><ul class="qs">${c.qs.map((q,i)=>`<li class="${S.chk?S.chk[i]:''}"><label><b>${'abcdefghij'[i]})</b> ${q[0]}<input data-i="${i}" value="${esc(S.ans[i]||'')}" inputmode="text" autocomplete="off"></label>${S.chk&&S.chk[i]=='sk'?'<small class="ok">Correcta</small>':S.chk&&S.chk[i]=='sb'?`<small class="bad">Revisa esta respuesta</small><div class="hint">💡 Pista: ${HT[S.stage][i]}</div>`:S.chk&&S.chk[i]=='sn'?'<small class="bad">Falta responder</small>':''}</li>`).join('')}</ul>`:''}</section>
 <section class="card lk">${lock()}<div><div class="ks">${ks}</div><label>${c.kd}<input id="key" placeholder="Escribe la clave" autocomplete="off"></label><div class="row"><button class="p" id="go">Probar clave</button>${S.stage<5?'<button id="re">Repetir con datos nuevos</button>':''}</div><div class="msg ${msg[0]=='✔'?'ok':'bad'}" role="status">${msg}</div><div class="mu" style="font-size:.9rem">Esta prueba: ${n[0]} intento${n[0]==1?'':'s'}, ${n[1]} fallo${n[1]==1?'':'s'}</div></div></section>`}
 if(S.started)h+=`<section class="card"><h2>Informe de la misión</h2>${logHTML()}<div class="row"><button class="p" id="dl">Descargar informe</button><button id="copy">Copiar informe</button><button id="reset">Borrar todo</button></div><div class="mu" id="dlm" style="margin-top:6px"></div><textarea id="rep" readonly hidden></textarea></section>`;
 a.innerHTML=h;shake=0}
function submit(){const raw=$('#key').value.trim();if(!raw)return;const c=S.cur,ok=same(raw,c.key);
 S.log.push({st:S.stage,v:S.vers[S.stage],k:raw,ok,answers:c.qs.map((q,i)=>({q:'abcdefghij'[i]+') '+q[0].slice(0,110),g:S.ans[i]||'',ok:same(S.ans[i]||'',q[1])}))});
 if(ok){S.keys[S.stage]=c.key;S.stage++;msg='✔ Candado abierto. Avanzas a la siguiente prueba.';
  if(S.stage>5){S.done=true;S.t1=Date.now()}else mk();save();render();scrollTo(0,0)}
 else{S.chk=c.qs.map((q,i)=>!(S.ans[i]||'').trim()?'sn':same(S.ans[i],q[1])?'sk':'sb');S.kbad=1;const nb=S.chk.filter(x=>x!='sk').length;
  msg=!c.qs.length?'✘ Código rechazado. Revisa cómo has combinado las claves con la fórmula.':nb?`✘ Clave rechazada. ${nb} respuesta${nb>1?'s':''} sin acertar o sin responder. Corrígela${nb>1?'s':''} y recalcula la clave.`:'✘ Clave rechazada. Todas tus respuestas son correctas: el fallo está en cómo has calculado la clave con la fórmula.';shake=1;save();render();$('#prueba').scrollIntoView()}}
document.addEventListener('input',e=>{const i=e.target.dataset.i;if(i!==undefined){S.ans[i]=e.target.value;if(S.chk)S.chk[i]='';const li=e.target.closest('li'),m=li.querySelector('small');li.className='';if(m)m.remove();const hh=li.querySelector('.hint');if(hh)hh.remove();$('#cnt').textContent=`Respondidas: ${S.ans.filter(x=>(x||'').trim()).length} de ${S.cur.qs.length}`;save()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='key')submit()});
document.addEventListener('click',async e=>{const id=e.target.id;
 if(id==='start'){S.names=$('#names').value.trim();S.curso=$('#curso').value.trim();if(!S.names){$('#names').focus();return}S.started=true;S.t0=Date.now();mk();msg='';save();render()}
 else if(id==='go')submit();
 else if(id==='re'){mk();msg='Datos nuevos generados. Lo anterior queda en el informe.';save();render()}
 else if(id==='copy'){const r=$('#rep');r.value=report();r.hidden=false;r.select();try{await navigator.clipboard.writeText(r.value);e.target.textContent='Informe copiado'}catch(x){}}
 else if(id==='dl'){const r=$('#rep');r.value=report();try{const d=await claude.use('downloads');if(!d)throw 0;await d.save({filename:'informe-hawkins-'+(S.names||'equipo').replace(/[^\wáéíóúñ]+/gi,'-').slice(0,40)+'.txt',data:r.value})}catch(x){r.hidden=false;$('#dlm').textContent='No se puede descargar aquí. Copia el texto de abajo y pégalo en un correo o documento.'}}
 else if(id==='reset'){if(rst++){S=fresh();msg='';rst=0;save();render()}else e.target.textContent='Pulsa otra vez para borrar todo'}});
render();
</script></body></html>
